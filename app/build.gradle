apply plugin: 'com.android.application'

ext {
    supportLibraryVersion = '1.0.0'
    grpcVersion = '1.11.0'
}

android {
    namespace 'nie.translator.rtranslator'
    ndkVersion "28.0.12674087"
    compileSdk 37
    defaultConfig {
        applicationId "io.github.maoruiqa.transpocket"
        targetSdkVersion 37
        versionName '0.1.4'
        versionCode 32
        minSdkVersion 28
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The CMake filter below only covers our own libraries. Without this one the APK also
        // packs the x86/armeabi-v7a copies from the AARs, and an x86_64 device then loads those
        // and finds no GGUF or Bergamot library.
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DSPM_ENABLE_SHARED=OFF',  //sentencepiece flags
                        '-DSPM_BUILD_TEST=OFF',
                        '-DSPM_ENABLE_TCMALLOC=OFF',
                        //bergamot flags
                        '-DANDROID_ABI=arm64-v8a',
                        '-DANDROID_PLATFORM=android-28',
                        '-DANDROID_STL=c++_shared',
                        "-DANDROID_PIE=ON",
                        "-DANDROID_CPP_FEATURES=exceptions",
                        '-DCMAKE_BUILD_TYPE=Release',
                        '-DBUILD_SHARED_LIBS=OFF',
                        '-DUSE_STATIC_LIBS=ON',
                        '-DCOMPILE_CUDA=OFF',
                        '-DUSE_WASM_COMPATIBLE_SOURCE=OFF',
                        '-DTHREADS_PREFER_PTHREAD_FLAG=ON',
                        '-DUSE_TCMALLOC=OFF',
                        '-DSSPLIT_USE_INTERNAL_PCRE2:BOOL=ON',
                        '-DUSE_PATHIECPP=ON',
                        // The vendored Bergamot tree is complete. Its configure step runs
                        // `git submodule update`, which cannot work on a copied checkout.
                        '-DGIT_SUBMODULE=OFF',
                        '-DBUILD_ARCH=armv8-a',
                        '-GNinja',
                        //'-DCMAKE_C_FLAGS="-O3 -fPIC -march=armv8-a -mtune=generic -ffast-math -funroll-loops -fdata-sections -ffunction-sections"',
                        //'-DCMAKE_CXX_FLAGS="-O3 -fPIC -march=armv8-a -mtune=generic -ffast-math -funroll-loops -fdata-sections -ffunction-sections"',
                        '-DCMAKE_CXX_FLAGS="-Wno-enum-constexpr-conversion"'
                cppFlags '-std=c++17'
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    packaging {
        jniLibs {
            // Keep native libraries inside the APK. Android 17 rejects System.load() of a writable copy.
            useLegacyPackaging = false
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            multiDexEnabled true
            debuggable true
        }
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled false

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources false

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin. To learn more, go to the section about
            // R8 configuration files.
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    configurations.all {
        resolutionStrategy.force 'com.google.code.findbugs:jsr305:3.0.2'
        resolutionStrategy.force "com.android.support:support-annotations:$supportLibraryVersion"
    }
    productFlavors {
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/src/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    //implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Support libraries
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation "com.google.android.material:material:1.9.0"  //1.9.0
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.recyclerview:recyclerview:1.0.0"
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation "androidx.preference:preference:1.1.0-alpha02"  //prima era 1.1.0-alpha02
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"
    implementation "com.github.worker8:RadioGroupPlus:1.0.1"
    //Download library
    implementation 'com.github.amitshekhariitbhu:PRDownloader:1.0.2'
    // DJL HuggingFace tokenizers wrapper
    implementation "ai.djl.android:core:0.33.0"
    implementation "ai.djl.huggingface:tokenizers:0.33.0"
    implementation "ai.djl.android:tokenizer-native:0.33.0"
    //protobuf
    implementation "com.google.protobuf:protobuf-javalite:4.33.5"
    // bouncycastle crypto lib
    implementation "org.bouncycastle:bcprov-jdk15to18:1.83"
    //lingua
    implementation "com.github.pemistahl:lingua:1.2.2"
    // VAD
    implementation 'com.github.gkonovalov.android-vad:silero:2.0.10'
    //implementation 'androidx.core:core-ktx:1.10.0'
    implementation 'androidx.work:work-runtime:2.7.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    //bluetooth communicator
    //implementation 'com.github.niedev:BluetoothCommunicator:1.0.6'
    //gallery image selector
    //implementation 'com.github.niedev:GalleryImageSelector:1.0.7'
    //ONNX Runtime
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'  //latest.release
    implementation 'com.microsoft.onnxruntime:onnxruntime-extensions-android:0.13.0'   //latest.release
    //JWS parser
    implementation group: 'com.nimbusds', name: 'nimbus-jose-jwt', version: '5.1'
    implementation files('libs/sqlite4java-android-release.aar')
    // Live Draft voices. Sherpa's ONNX Runtime 1.28.2 is stored as libort_sherpa.so
    // so it does not replace onnxruntime-android 1.30 used by recognition and translation.
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    //Room library (database)
    def room_version = '2.1.0'
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version" // use kapt for Kotlin
    // optional - RxJava support for Room
    implementation "androidx.room:room-rxjava2:$room_version"
    // optional - Guava support for Room, including Optional and ListenableFuture
    implementation "androidx.room:room-guava:$room_version"
    // Test helpers
    testImplementation "androidx.room:room-testing:$room_version"
    // Tests
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}
